apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: nncp-master-0
spec:
  nodeSelector:
    kubernetes.io/hostname: master-0.rhoso-oac.cluster.com

  desiredState:
    interfaces:

      # --------------------------------------------------
      # RHOSO Control Plane and Service Networks (eno2)
      # --------------------------------------------------
      - name: eno2
        description: RHOSO control plane and service VLAN trunk
        type: ethernet
        state: up
        mtu: 1500
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.122.10
              prefix-length: 24
        ipv6:
          enabled: false

      # Internal API
      - name: internalapi
        description: Internal API VLAN 20
        type: vlan
        state: up
        mtu: 1500
        vlan:
          base-iface: eno2
          id: 20
          reorder-headers: true
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.17.0.10
              prefix-length: 24
        ipv6:
          enabled: false

      # Tenant
      - name: tenant
        description: Tenant VLAN 22
        type: vlan
        state: up
        mtu: 1500
        vlan:
          base-iface: eno2
          id: 22
          reorder-headers: true
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.19.0.10
              prefix-length: 24
        ipv6:
          enabled: false


      # --------------------------------------------------
      # Separate physical interface for Ironic
      # --------------------------------------------------
      - description: ironic interface
        name: eno17
        mtu: 1500
        state: up
        type: ethernet
        ipv4:
          enabled: false
          dhcp: false
        ipv6:
          enabled: false

      - name: ironicbr
        type: linux-bridge
        description: Ironic provisioning bridge
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: eno17
              vlan: {}
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        mtu: 1500
        state: up

      - name: ironicbr.83
        type: vlan
        description: Ironic provisioning VLAN 83
        state: up
        vlan:
          base-iface: ironicbr
          id: 83
        ipv4:
          address:
            - ip: 172.20.1.16
              prefix-length: 24
          dhcp: false
          enabled: true
        ipv6:
          enabled: false
        mtu: 1500
